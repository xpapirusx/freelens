# yaml-language-server: $schema=https://raw.githubusercontent.com/freelensapp/freelens/main/schemas/theme-v1.schema.json
#
# The Dracula theme, from the palette of https://github.com/dracula/terminal-app.
# Dracula is a dark theme, so it has no light variant.
apiVersion: freelens.app/v1
kind: Theme
metadata:
  name: dracula
spec:
  displayName: Dracula
  description: The classic dark purple, pink and green on near-black
  author: Dracula Theme
  dark:
    colors:
      blue: "#bd93f9"
      magenta: "#ff79c6"
      golden: "#f1fa8c"
      halfGray: "#6272a480"
      primary: "#bd93f9"
      textColorPrimary: "#f8f8f2"
      textColorSecondary: "#c5c6d0"
      textColorTertiary: "#6272a4"
      textColorAccent: "#ffffff"
      textColorDimmed: "#f8f8f28c"
      textColorOnPrimary: "#21222c"
      borderColor: "#44475a"
      borderFaintColor: "#44475a66"
      mainBackground: "#282a36"
      secondaryBackground: "#21222c"
      contentColor: "#21222c"
      layoutBackground: "#282a36"
      layoutTabsBackground: "#21222c"
      layoutTabsActiveColor: "#f8f8f2"
      layoutTabsLineColor: "#44475a"
      sidebarLogoBackground: "#21222c"
      sidebarActiveColor: "#21222c"
      sidebarSubmenuActiveColor: "#ff79c6"
      sidebarBackground: "#21222c"
      sidebarItemHoverBackground: "#44475a"
      badgeBackgroundColor: "#44475a"
      buttonPrimaryBackground: "#bd93f9"
      buttonDefaultBackground: "#44475a"
      buttonLightBackground: "#6272a4"
      buttonAccentBackground: "#ff5555"
      buttonDisabledBackground: "#6272a4"
      tableBgcStripe: "#242530"
      tableBgcSelected: "#44475a"
      tableHeaderBackground: "#282a36"
      tableHeaderColor: "#6272a4"
      tableSelectedRowColor: "#f8f8f2"
      helmLogoBackground: "#f8f8f2"
      helmStableRepo: "#50fa7b"
      helmIncubatorRepo: "#ffb86c"
      helmDescriptionHr: "#44475a"
      helmDescriptionBlockquoteColor: "#c5c6d0"
      helmDescriptionBlockquoteBorder: "#6272a4"
      helmDescriptionBlockquoteBackground: "#343746"
      helmDescriptionHeaders: "#f8f8f2"
      helmDescriptionH6: "#6272a4"
      helmDescriptionTdBorder: "#44475a"
      helmDescriptionTrBackground: "#21222c"
      helmDescriptionCodeBackground: "#44475a66"
      helmDescriptionPreBackground: "#21222c"
      helmDescriptionPreColor: "#f8f8f2"
      colorSuccess: "#50fa7b"
      colorOk: "#50fa7b"
      colorInfo: "#8be9fd"
      colorError: "#ff5555"
      colorSoftError: "#ff6e6e"
      colorWarning: "#ffb86c"
      colorVague: "#44475a"
      colorTerminated: "#6272a4"
      dockHeadBackground: "#21222c"
      dockInfoBackground: "#282a36"
      dockInfoBorderColor: "#44475a"
      dockEditorBackground: "#282a36"
      dockEditorTag: "#8be9fd"
      dockEditorKeyword: "#ff79c6"
      dockEditorComment: "#6272a4"
      dockEditorActiveLineBackground: "#44475a"
      dockBadgeBackground: "#44475a"
      dockTabBorderColor: "#44475a"
      dockTabActiveBackground: "#343746"
      logsBackground: "#1e1f29"
      logsForeground: "#f8f8f2"
      logRowHoverBackground: "#343746"
      dialogTextColor: "#c5c6d0"
      dialogBackground: "#21222c"
      dialogHeaderBackground: "#343746"
      dialogFooterBackground: "#282a36"
      drawerTogglerBackground: "#343746"
      drawerTitleText: "#f8f8f2"
      drawerSubtitleBackground: "#343746"
      drawerItemNameColor: "#6272a4"
      drawerItemValueColor: "#f8f8f2"
      clusterMenuBackground: "#282a36"
      clusterMenuBorderColor: "#44475a"
      clusterMenuCellBackground: "#21222c"
      clusterMenuCellOutline: "#ffffff66"
      clusterSettingsBackground: "#21222c"
      addClusterIconColor: "#44475a"
      boxShadow: "#00000066"
      iconActiveColor: "#f8f8f2"
      iconActiveBackground: "#ffffff18"
      filterAreaBackground: "#21222c"
      chartLiveBarBackground: "#00000033"
      chartStripesColor: "#ffffff08"
      chartCapacityColor: "#44475a"
      pieChartDefaultColor: "#343746"
      inputOptionHoverColor: "#f8f8f2"
      inputControlBackground: "#282a36"
      inputControlBorder: "#44475a"
      inputControlHoverBorder: "#6272a4"
      lineProgressBackground: "#44475a"
      radioActiveBackground: "#343746"
      menuActiveBackground: "#bd93f9"
      menuSelectedOptionBgc: "#44475a"
      canvasBackground: "#282a36"
      scrollBarColor: "#6272a4"
      settingsBackground: "#21222c"
      settingsColor: "#c5c6d0"
      navSelectedBackground: "#44475a"
      navHoverColor: "#ffffff"
      hrColor: "#44475a66"
      tooltipBackground: "#343746"
    terminalColors:
      background: "#1e1f29"
      foreground: "#f8f8f2"
      cursor: "#f8f8f2"
      cursorAccent: "#1e1f29"
      selectionBackground: "#44475a"
      selectionInactiveBackground: "#44475a80"
      black: "#282a36"
      red: "#ff5555"
      green: "#50fa7b"
      yellow: "#f1fa8c"
      blue: "#bd93f9"
      magenta: "#ff79c6"
      cyan: "#8be9fd"
      white: "#f8f8f2"
      brightBlack: "#6272a4"
      brightRed: "#ff6e6e"
      brightGreen: "#69ff94"
      brightYellow: "#ffffa5"
      brightBlue: "#d6acff"
      brightMagenta: "#ff92df"
      brightCyan: "#a4ffff"
      brightWhite: "#ffffff"
    editor:
      base: vs-dark
      inherit: true
      colors:
        editor.foreground: "#f8f8f2"
        editor.background: "#282a36"
        editor.selectionBackground: "#44475a"
        editor.lineHighlightBackground: "#44475a66"
        editorCursor.foreground: "#f8f8f2"
        editorWhitespace.foreground: "#44475a"
      tokens:
        "": {background: "#282a36"}
        comment: "#6272a4"
        string: "#f1fa8c"
        constant.numeric: "#bd93f9"
        constant.language: "#bd93f9"
        keyword: "#ff79c6"
        keyword.operator: "#ff79c6"
        storage: "#ff79c6"
        support.function: "#50fa7b"
        entity.name.tag: "#ff79c6"
        entity.other.attribute-name: "#50fa7b"
        invalid: {foreground: "#f8f8f2", background: "#ff5555"}
